# woven: MVP fork image build → GHCR (ghcr.io/arustydev/plane-*).
# Builds the six Plane service images from THIS fork's Dockerfiles and publishes them to the
# fork-owned GHCR namespace, authenticated with the workflow's GITHUB_TOKEN (no PAT needed —
# the repo owner is arustydev). Additive; does not touch the inherited upstream build-branch.yml
# (which still targets Docker Hub makeplane/*). Tracks bead plane-8xx.
#
# MVP scope: manual (workflow_dispatch) + push to the integration branch. The release-driven,
# cosign-signed variant with SLSA provenance/SBOM is plane-7fn.4.6/.7 (F0.6).
name: Build & publish Plane images (GHCR)

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra tag to apply to all images (e.g. v1.3.1-woven.1)"
        required: false
        type: string
  push:
    branches: [main] # woven: fork integration branch (renamed from master — plane-7fn.4.1)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - ".beads/**"

concurrency:
  group: woven-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: arustydev # ghcr.io/arustydev/plane-<service>

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: plane-admin, dockerfile: apps/admin/Dockerfile.admin, context: "." }
          - { image: plane-frontend, dockerfile: apps/web/Dockerfile.web, context: "." }
          - { image: plane-space, dockerfile: apps/space/Dockerfile.space, context: "." }
          - { image: plane-live, dockerfile: apps/live/Dockerfile.live, context: "." }
          - { image: plane-backend, dockerfile: apps/api/Dockerfile.api, context: "apps/api" }
          - { image: plane-proxy, dockerfile: apps/proxy/Dockerfile.ce, context: "apps/proxy" }
    name: build ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
