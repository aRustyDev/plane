# woven: MVP fork image build → GHCR (ghcr.io/arustydev/plane-*).
# Builds the six Plane service images from THIS fork's Dockerfiles and publishes them to the
# fork-owned GHCR namespace, authenticated with the workflow's GITHUB_TOKEN (no PAT needed —
# the repo owner is arustydev). Additive; does not touch the inherited upstream build-branch.yml
# (which still targets Docker Hub makeplane/*). Tracks plane-8xx / plane-7fn.4.6 / plane-7fn.4.7.
#
# Release-driven: fires on a published GitHub Release (release-please cuts it on release-PR
# merge) and tags images with the release version (vX.Y.Z, vX.Y) + latest + sha. This avoids the
# GITHUB_TOKEN-tag-no-trigger gotcha (keys off the Release event, not `push: tags`).
# workflow_dispatch stays for manual/test builds.
#
# Supply chain (plane-7fn.4.7): every image is signed and attested by DIGEST (never the tag) —
#   1. cosign sign (keyless, GitHub OIDC → Fulcio, logged to Rekor)
#   2. actions/attest-sbom (Syft SPDX SBOM → OCI referrer + GH attestation store)
#   3. actions/attest-build-provenance (SLSA v1 provenance → OCI referrer + GH attestation store)
#   4. trivy GATES on fixable HIGH/CRITICAL in our LIBRARY deps; grype reports the full SBOM → SARIF
# Both attestations use the GitHub attest-* actions (uniform OCI-1.1 referrer storage) so cosign v3
# (referrers-only) and `gh attestation verify` both see them. (cosign attest writes the legacy
# `.att` tag, which cosign v3 verify-attestation can't read — that's why we don't use it here.)
#
# Verify a released image (what the woven-o11y admission policy enforces — plane-7fn.4.8).
# NOTE: pass the FULL predicate-type URI to cosign — the --type spdxjson/slsaprovenance shorthands
# do not map to these predicate types in cosign v3. The SBOM type carries the SPDX spec version
# (…/Document/v2.3); match on that exact value or the …/Document prefix as your tooling allows.
#   IDENTITY='https://github.com/aRustyDev/plane/.github/workflows/woven-build.yml@refs/tags/v.*'
#   ISSUER=https://token.actions.githubusercontent.com
#   IMG=ghcr.io/arustydev/plane-backend:v1.4.0
#   cosign verify --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMG"
#   cosign verify-attestation --type https://spdx.dev/Document/v2.3 \
#     --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMG"
#   cosign verify-attestation --type https://slsa.dev/provenance/v1 \
#     --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMG"
#   gh attestation verify oci://$IMG --owner aRustyDev            # SLSA provenance
#   gh attestation verify oci://$IMG --owner aRustyDev --predicate-type https://spdx.dev/Document  # SBOM
# (Release builds sign under @refs/tags/v*; workflow_dispatch builds sign under @refs/heads/main.)
name: Build & publish Plane images (GHCR)

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra tag to apply to all images (e.g. v1.4.0-rc.1)"
        required: false
        type: string
  release:
    types: [published]

concurrency:
  group: woven-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to GHCR + push attestations
  id-token: write # cosign keyless (Fulcio) + attest-build-provenance OIDC
  attestations: write # actions/attest-build-provenance → GitHub attestation store
  security-events: write # upload trivy SARIF to the Security tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: arustydev # ghcr.io/arustydev/plane-<service>

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # gate: true = fail the release on fixable HIGH/CRITICAL in OUR library deps. The proxy is
          # a pure inherited upstream image (we build no code into it), so its base-image/Go-binary
          # CVEs are report-only here and tracked for a base-image refresh (plane-7fn.4.23).
          - { image: plane-admin, dockerfile: apps/admin/Dockerfile.admin, context: ".", gate: true }
          - { image: plane-frontend, dockerfile: apps/web/Dockerfile.web, context: ".", gate: true }
          - { image: plane-space, dockerfile: apps/space/Dockerfile.space, context: ".", gate: true }
          - { image: plane-live, dockerfile: apps/live/Dockerfile.live, context: ".", gate: true }
          - { image: plane-backend, dockerfile: apps/api/Dockerfile.api, context: "apps/api", gate: true }
          - { image: plane-proxy, dockerfile: apps/proxy/Dockerfile.ce, context: "apps/proxy", gate: false }
    name: build ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          # latest=false disables the default latest=auto flavor, which would emit a SECOND
          # `latest` tag on semver releases (duplicating the explicit release-gated raw tag below).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # ── Supply chain: sign + attest by digest (plane-7fn.4.7) ────────────────────────────
      # Everything below pins to the immutable digest (steps.build.outputs.digest), never a
      # mutable tag, so signatures/attestations bind to the exact bytes that were pushed.
      - name: Set image ref (by digest)
        id: ref
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign image (keyless)
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ref.outputs.image_ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── Vulnerability scanning (plane-7fn.4.12 / .22) ─────────────────────────────────────
      # Division of labour, decided after triaging the baseline (which is ~95% inherited base-image
      # OS packages + the inherited proxy Go binary — none of which our deps control):
      #   • Trivy = the GATE, scoped to LIBRARY packages (TRIVY_PKG_TYPES=library) so it fails the
      #     release only on fixable HIGH/CRITICAL in OUR application deps (pnpm workspace + apps/api
      #     pip), not on inherited Alpine OS packages. matrix.gate turns the gate off for the proxy
      #     (a pure inherited image). ignore-unfixed so un-patchable CVEs never block.
      #   • Grype = full REPORT-ONLY over the Syft SBOM (OS + library), never gates — it keeps the
      #     inherited base-image backlog visible in the Security tab (tracked for refresh in 4.23).
      # Both upload SARIF via `if: always()`. NOTE: scans run AFTER push/sign, so a gate fails the
      # release JOB (a loud signal), not the publish — a scan-before-push restructure is 4.21.
      - name: Scan image (trivy — gate on our library deps)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PKG_TYPES: library # gate on app/language deps, not inherited OS packages
        with:
          image-ref: ${{ steps.ref.outputs.image_ref }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ matrix.gate && '1' || '0' }} # proxy (inherited) → report-only

      - name: Upload trivy SARIF
        if: always()
        continue-on-error: true # the scan is the gate; a SARIF upload hiccup must not add noise
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Scan SBOM (grype — full, report-only)
        if: always() && steps.build.conclusion == 'success' # run even if trivy gated, once an image exists
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: false # report-only: full OS+library visibility, trivy is the gate
          output-format: sarif
          output-file: grype-${{ matrix.image }}.sarif

      - name: Upload grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: grype-${{ matrix.image }}.sarif
          category: grype-${{ matrix.image }}
