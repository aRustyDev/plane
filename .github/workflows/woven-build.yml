# woven: MVP fork image build → GHCR (ghcr.io/arustydev/plane-*).
# Builds the six Plane service images from THIS fork's Dockerfiles and publishes them to the
# fork-owned GHCR namespace, authenticated with the workflow's GITHUB_TOKEN (no PAT needed —
# the repo owner is arustydev). Additive; does not touch the inherited upstream build-branch.yml
# (which still targets Docker Hub makeplane/*). Tracks plane-8xx / plane-7fn.4.6.
#
# Release-driven: fires on a published GitHub Release (release-please cuts it on release-PR
# merge) and tags images with the release version (vX.Y.Z, vX.Y) + latest + sha. This avoids the
# GITHUB_TOKEN-tag-no-trigger gotcha (keys off the Release event, not `push: tags`).
# workflow_dispatch stays for manual/test builds. cosign signing + SLSA provenance/SBOM = 4.7.
name: Build & publish Plane images (GHCR)

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra tag to apply to all images (e.g. v1.4.0-rc.1)"
        required: false
        type: string
  release:
    types: [published]

concurrency:
  group: woven-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: arustydev # ghcr.io/arustydev/plane-<service>

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: plane-admin, dockerfile: apps/admin/Dockerfile.admin, context: "." }
          - { image: plane-frontend, dockerfile: apps/web/Dockerfile.web, context: "." }
          - { image: plane-space, dockerfile: apps/space/Dockerfile.space, context: "." }
          - { image: plane-live, dockerfile: apps/live/Dockerfile.live, context: "." }
          - { image: plane-backend, dockerfile: apps/api/Dockerfile.api, context: "apps/api" }
          - { image: plane-proxy, dockerfile: apps/proxy/Dockerfile.ce, context: "apps/proxy" }
    name: build ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
