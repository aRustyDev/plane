name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["preview", "canary", "main"]
  pull_request:
    branches: ["preview", "canary", "main"]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "false"

    strategy:
      fail-fast: false
      matrix:
        # woven: added `actions` to scan our own workflow files (supply-chain queries). plane-7fn.4.9
        language: ["python", "javascript", "actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # woven: security-extended query suite + `actions` language. plane-7fn.4.9
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
