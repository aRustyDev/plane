# OpenSSF Scorecard policy for the scheduled CLI audit (.github/workflows/scorecard.yml).
# Scorecard's SARIF output requires a policy entry for every check that runs; this mirrors the
# canonical ossf/scorecard-action default (policies/template.yml). Contributors and Signed-Releases
# are left disabled (as upstream) — Signed-Releases only detects release-asset signatures, not our
# GHCR cosign/attestations, so enforcing it would score a misleading 0. Tracks plane-7fn.4.16.
version: 1
policies:
  Token-Permissions:
      score: 10
      mode: enforced
  Branch-Protection:
      score: 10
      mode: enforced
  Code-Review:
      score: 10
      mode: enforced
  Dangerous-Workflow:
      score: 10
      mode: enforced
  License:
      score: 9
      mode: enforced
  Pinned-Dependencies:
      score: 10
      mode: enforced
  Security-Policy:
      score: 10
      mode: enforced
  SAST:
      score: 10
      mode: enforced
  Contributors:
      score: 10
      mode: disabled
  Packaging:
      score: 10
      mode: enforced
  Binary-Artifacts:
      score: 10
      mode: enforced
  Signed-Releases:
      score: 10
      mode: disabled
  Dependency-Update-Tool:
      score: 10
      mode: enforced
  Fuzzing:
      score: 10
      mode: enforced
  CII-Best-Practices:
      score: 5
      mode: enforced
  Vulnerabilities:
      score: 10
      mode: enforced
  CI-Tests:
      score: 10
      mode: enforced
  Maintained:
      score: 1
      mode: enforced
