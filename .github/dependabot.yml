# woven: Dependabot — automated dependency + base-image + Action updates for the fork.
# Complements the release-build supply-chain scanning (cosign/SBOM/trivy, plane-7fn.4.7) by
# keeping inputs patched at the source. Tracks plane-7fn.4.9 (§H). Grouped to keep PR volume sane.
version: 2
updates:
  # JS/TS monorepo — pnpm workspace rooted at the repo top; the pnpm updater traverses workspace
  # packages from here. Minor/patch batched into one PR; majors raised individually for review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      js-minor-patch:
        update-types: [minor, patch]
    # woven (plane-7fn.4.14): these packages are version-pinned centrally in the root package.json
    # `pnpm.overrides` (security/consistency pins from #9456 + catalog:). Dependabot bumps only the
    # leaf specs + lockfile `overrides` snapshot, leaving the root override untouched, which breaks
    # `pnpm install --frozen-lockfile` (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH) on every such PR. Update
    # these deliberately by editing `pnpm.overrides` (and the catalog) instead. KEEP THIS LIST IN
    # SYNC with the keys of `pnpm.overrides`.
    ignore:
      - dependency-name: "@babel/helpers"
      - dependency-name: "@babel/runtime"
      - dependency-name: "@isaacs/brace-expansion"
      - dependency-name: "@types/express"
      - dependency-name: "ajv"
      - dependency-name: "axios"
      - dependency-name: "brace-expansion"
      - dependency-name: "chokidar"
      - dependency-name: "defu"
      - dependency-name: "diff"
      - dependency-name: "esbuild"
      - dependency-name: "express"
      - dependency-name: "flatted"
      - dependency-name: "follow-redirects"
      - dependency-name: "glob"
      - dependency-name: "happy-dom"
      - dependency-name: "js-yaml"
      - dependency-name: "lodash"
      - dependency-name: "lodash-es"
      - dependency-name: "markdown-it"
      - dependency-name: "mdast-util-to-hast"
      - dependency-name: "minimatch"
      - dependency-name: "nanoid"
      - dependency-name: "path-to-regexp"
      - dependency-name: "picomatch"
      - dependency-name: "postcss"
      - dependency-name: "prosemirror-model"
      - dependency-name: "prosemirror-state"
      - dependency-name: "prosemirror-transform"
      - dependency-name: "prosemirror-view"
      - dependency-name: "qs"
      - dependency-name: "rollup"
      - dependency-name: "serialize-javascript"
      - dependency-name: "tar-fs"
      - dependency-name: "typescript"
      - dependency-name: "undici"
      - dependency-name: "uuid"
      - dependency-name: "valibot"
      - dependency-name: "vite"
      - dependency-name: "webpack"
      - dependency-name: "ws"
      - dependency-name: "yaml"

  # Python API (apps/api/requirements.txt + requirements/*.txt via -r, and pyproject.toml).
  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      py-minor-patch:
        update-types: [minor, patch]

  # Container base images — one dir per service Dockerfile (Dockerfile.<svc> is matched by the
  # docker updater's case-insensitive "dockerfile" filename match).
  - package-ecosystem: docker
    directories:
      - "/apps/admin"
      - "/apps/web"
      - "/apps/space"
      - "/apps/live"
      - "/apps/api"
      - "/apps/proxy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker-base-images:
        patterns: ["*"]

  # GitHub Actions pinned across our workflows (keeps woven-build / release-please / CI current;
  # feeds the eventual SHA-pin work — plane-7fn.4.11).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns: ["*"]
